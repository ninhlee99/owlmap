[package]
name = "owlmap"
version = "0.4.0"
edition = "2021"
description = "Turn an undocumented codebase into a navigable map with Claude"
license = "UNLICENSED"
publish = false

[[bin]]
name = "owlmap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
globset = "0.4"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
